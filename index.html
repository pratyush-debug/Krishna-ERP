<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krishna ERP | Inventory Demo</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#f4f7fb;color:#172033}*{box-sizing:border-box}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#102b4d;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:700;margin-bottom:20px}.brand small{display:block;font-size:11px;color:#aac0db;margin-top:3px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d3deeb;padding:10px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.a{background:#1c4775;color:#fff}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid #d9e2ec;display:flex;justify-content:space-between;align-items:center;padding:0 22px}.content{padding:22px}.banner{background:#fff6d9;border:1px solid #ecd48b;padding:12px;border-radius:10px;margin-bottom:16px;color:#795500}.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(6,1fr)}.card{background:#fff;border:1px solid #d8e1ec;border-radius:12px;padding:16px}.card b{font-size:25px}.muted{color:#667085;font-size:12px}.two{grid-template-columns:1fr 1fr}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.btn,input{border:1px solid #ccd7e4;background:#fff;padding:9px 11px;border-radius:8px}.btn{cursor:pointer}.btn.p{background:#245f9d;color:#fff;border-color:#245f9d}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e5ebf2;text-align:left}th{background:#eef3f8}.wrap{overflow:auto;border:1px solid #d8e1ec;border-radius:8px}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#e9f7ed;color:#166534}.badge.w{background:#fff1d6;color:#9a5a00}.flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.flow span{background:#edf3f9;border:1px solid #d6e0ea;padding:7px;border-radius:7px;font-size:12px}.reports{grid-template-columns:repeat(4,1fr)}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#14283f;color:#fff;padding:10px 14px;border-radius:8px}.menu{display:none}@media(max-width:900px){.app{display:block}.side{position:fixed;width:250px;left:-260px;z-index:5;transition:.2s}.side.open{left:0}.menu{display:block}.k{grid-template-columns:repeat(2,1fr)}.two,.reports{grid-template-columns:1fr}.content{padding:12px}}</style></head><body><div class="app"><aside id="side" class="side"><div class="brand">Krishna ERP<small>SAP B1-Inspired Inventory Management</small></div><div id="nav" class="nav"></div></aside><section class="main"><header class="top"><div><button class="btn menu" onclick="side.classList.toggle('open')">☰</button> <strong id="title">Inventory Control Center</strong></div><span class="badge w">DUMMY / UAT DATA</span></header><main class="content"><div class="banner"><b>Demo only:</b> all companies, stock, batches, serials, documents, values, users and transactions below are dummy data.</div><div id="view"></div></main></section></div><div id="toast" class="toast"></div><script>
const D={items:[['RABS0001','ABS Granule Black','RM','KG','Batch',12450,871500],['SPBR0040','EN-5002 Printed Body Red','SFG','PCS','Batch',18500,351500],['SFAT0094','EN-5002 Ready Torch Red','FG','PCS','Serial',9240,1386000],['SGBP0093','EN-5002 Blister Packed Red','FG','PCS','Serial',7160,1288800],['STNR0001','A4 Paper 75 GSM','Stationery','REAM','None',74,19240]],wh:[['BDI-RM','Bidadi RM Warehouse','BDI','RM',182450],['BDI-FG','Bidadi FG Warehouse','BDI','FG',84520],['HLV-RM','Hulivana RM Warehouse','HLV','RM',96300],['TGH-SFG','Taggahalli SFG Warehouse','TGH','SFG',41680],['MDR-FG','Maddur FG Warehouse','MDR','FG',68900],['TRANSIT','Inter-Plant Transit','BDI','TRANSIT',12200]],docs:[['GR-2026-000041','Goods Receipt','07-08-2026','Posted',5600,418000],['GI-2026-000032','Goods Issue','07-08-2026','Posted',740,65200],['ITR-2026-000018','Transfer Request','07-08-2026','Approved',2400,188000],['IT-2026-000016','Inventory Transfer','07-08-2026','In Transit',1200,84000],['IC-2026-000009','Inventory Counting','06-08-2026','Pending Recount',0,0]],batches:[['RABS0001','B-ABS-260801','BDI-RM','A-01-01',5000,'Released'],['RABS0001','B-ABS-260805','BDI-RM','A-01-02',7450,'Released'],['SPBR0040','PB-R-260806','TGH-SFG','S-02-03',18500,'Released']]};
const M=[['dashboard','Dashboard'],['org','Organization / Branch'],['items','Item Management'],['warehouse','Warehouse / Rack / Bin'],['opening','Opening Balance'],['receipt','Goods Receipt'],['issue','Goods Issue'],['itr','Transfer Request'],['transfer','Inventory Transfer'],['pick','Pick & Pack'],['count','Inventory Counting'],['posting','Inventory Posting'],['revalue','Revaluation'],['stock','Stock Overview'],['batch','Batch Management'],['serial','Serial Management'],['trace','Traceability'],['reports','Reports'],['mobile','Barcode / QR / Mobile'],['admin','Security / Approvals / Audit']];let cur='dashboard';
function badge(x){return `<span class="badge ${/Transit|Pending/.test(x)?'w':''}">${x}</span>`}function money(n){return '₹'+Number(n).toLocaleString('en-IN')}function tbl(h,r){return `<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function toast(x){toast=document.getElementById('toast');toast.innerText=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}function flow(a){return `<div class="flow">${a.map((x,i)=>`${i?'→ ':''}<span>${x}</span>`).join('')}</div>`}
function nav(){nav=document.getElementById('nav');nav.innerHTML=M.map(x=>`<button class="${x[0]==cur?'a':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(x){cur=x;side.classList.remove('open');nav();render()}
function dashboard(){let val=D.items.reduce((a,x)=>a+x[6],0),qty=D.items.reduce((a,x)=>a+x[5],0);return `<div class="grid k">${[['Inventory Value',money(val)],['Items',D.items.length],['On Hand',qty.toLocaleString('en-IN')],['Warehouses',D.wh.length],['In Transit','12,200'],['Pending Counts','1']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Recent Inventory Documents</h3>${tbl(['Document','Type','Date','Status','Qty','Value'],D.docs.map(x=>[x[0],x[1],x[2],badge(x[3]),x[4],money(x[5])]))}</div>`}
function items(){return `<div class="card"><div class="toolbar"><input placeholder="Search item code / name"><button class="btn p" onclick="toast('Dummy item created')">+ New Item</button><button class="btn" onclick="toast('CSV export simulated')">Export</button></div>${tbl(['Code','Item Name','Group','UoM','Tracking','On Hand','Value'],D.items.map(x=>[...x.slice(0,6),money(x[6])]))}</div>`}
function wh(){return `<div class="card">${tbl(['Warehouse','Name','Branch','Type','On Hand'],D.wh)}</div><div class="card" style="margin-top:14px"><h3>Location hierarchy</h3>${flow(['Company','Branch','Warehouse','Zone','Rack','Level','Bin'])}</div>`}
function transaction(name,no){return `<div class="card"><h3>${name} — Dummy Document</h3><div class="toolbar"><input value="${no}" disabled><input value="07-08-2026"><button class="btn">Save Draft</button><button class="btn">Submit</button><button class="btn p" onclick="toast('Posting simulated; no real stock changed')">Post Dummy</button></div>${tbl(['Item','Description','Warehouse','Qty','Tracking'],D.items.slice(0,3).map(x=>[x[0],x[1],'BDI-RM',Math.min(x[5],500),x[4]]))}</div><div class="card" style="margin-top:14px"><h3>Posting control</h3>${flow(['Validate','Approve','Allocate Bin/Batch/Serial','Lock & Recheck','Ledger','Balances','Audit'])}</div>`}
function render(){let name=M.find(x=>x[0]==cur)[1];title.innerText=name;let v='';if(cur=='dashboard')v=dashboard();else if(cur=='items')v=items();else if(cur=='warehouse')v=wh();else if(cur=='org')v=`<div class="card">${tbl(['Code','Branch / Company','Status'],[['GEP-DEMO','Geaan Electronics Demo Pvt Ltd',badge('Active')],['BDI','Bidadi Main Plant',badge('Active')],['HLV','Hulivana Plant',badge('Active')],['TGH','Taggahalli Plant',badge('Active')],['MDR','Maddur New Plant',badge('Active')]])}</div>`;else if(cur=='batch')v=`<div class="card">${tbl(['Item','Batch','Warehouse','Bin','Qty','Status'],D.batches.map(x=>[...x.slice(0,5),badge(x[5])]))}</div>`;else if(cur=='serial')v=`<div class="card">${tbl(['Serial','Item','Warehouse','Bin','Status'],Array.from({length:10},(_,i)=>['EN5002R-'+(26080001+i),'SFAT0094',i<7?'BDI-FG':'MDR-FG','F-01-01',badge('Available')]))}</div>`;else if(cur=='stock')v=dashboard();else if(cur=='trace')v=`<div class="card"><h3>Forward / Reverse Traceability</h3>${flow(['GR-2026-000041','Batch B-ABS-260801','BDI-RM / A-01-01','GI-2026-000032','IT-2026-000016'])}</div>`;else if(cur=='pick')v=`<div class="card"><h3>Barcode picking</h3>${flow(['Scan Bin','Scan Item','Scan Batch/Serial','Enter Qty','Validate','Picked'])}</div>`;else if(cur=='count')v=`<div class="card">${tbl(['Count','Warehouse','System','Counted','Variance','Status'],[['IC-2026-000009','MDR-FG',28120,28096,-24,badge('Pending Recount')],['IC-2026-000008','BDI-RM',48620,48620,0,badge('Completed')]])}</div>`;else if(cur=='reports')v=`<div class="grid reports">${['Inventory Status','Movement','Audit','Valuation','Batch','Serial','Bin Content','Stock Aging','Slow Moving','Low Stock','Transfer','Count Variance'].map(x=>`<div class="card" onclick="toast('${x} opened')"><b style="font-size:15px">${x}</b><div class="muted">Filter • Excel • PDF • Print • Drill-down</div></div>`).join('')}</div>`;else if(cur=='mobile')v=`<div class="card"><h3>Mobile scan flow</h3>${flow(['Scan Bin','Scan Item','Scan Batch/Serial','Qty','Confirm'])}</div>`;else if(cur=='admin')v=`<div class="card">${tbl(['User','Role','Branch','Access'],[['Demo Administrator','SUPER_ADMIN','All','All'],['Bidadi Store User','STORE_USER','BDI','BDI-RM / BDI-FG'],['Management Viewer','VIEWER','All','Read Only']])}</div>`;else {let map={opening:['Opening Balance','OB-2026-000003'],receipt:['Goods Receipt','GR-2026-000042'],issue:['Goods Issue','GI-2026-000033'],itr:['Transfer Request','ITR-2026-000019'],transfer:['Inventory Transfer','IT-2026-000017'],posting:['Inventory Posting','IP-2026-000007'],revalue:['Inventory Revaluation','IR-2026-000005']};v=transaction(...map[cur])}view.innerHTML=v}nav();render();
</script></body></html>
