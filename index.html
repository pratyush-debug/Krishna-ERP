function tx(type,title,incoming){return head(title,incoming?'Controlled receipt that increases stock.':'Controlled issue that decreases stock.','<button id="tnew" class="btn p">+ New '+title+'</button>')+`<div class="card ct">${table(['Document','Date','Status','Warehouse','Reason','Value'],d.docs.filter(x=>x[1]==type).map(x=>[`<b class="mono">${x[0]}</b>`,x[2],bd(x[3]),wh(x[4])[1],x[5],cash(x[6])]))}</div>`}function txForm(type){let incoming=type!='GI',title=type=='GR'?'Goods Receipt':type=='GI'?'Goods Issue':'Opening Balance';modal('Post '+title,`<div class="notice">${incoming?'Stock will increase.':'Negative stock is blocked.'} Posted demo documents are not directly edited.</div><div class="fg"><div class="fld"><label>Date</label><input id="td" type="date" value="${day()}"></div><div class="fld"><label>Warehouse</label><select id="tw">${opts(d.wh)}</select></div><div class="fld full"><label>Reason</label><input id="tr" value="UAT ${title}"></div></div><div class="lines"><b>Item Lines</b><div id="lrows"></div><button id="la" class="btn" style="margin-top:8px">+ Add line</button></div>`,'Validate & Post',()=>{try{let ls=$$('.ln').map(r=>[r.querySelector('.li').value,+r.querySelector('.lq').value,+r.querySelector('.lc').value,r.querySelector('.lb').value]).filter(x=>x[0]&&x[1]>0);if(!ls.length)throw Error('Add at least one line');let n=no(type),v=0;ls.forEach(l=>{let b=l[3]||d.bins.find(x=>x[1]==tw.value)?.[0];stockMove(l[0],tw.value,b,(incoming?1:-1)*l[1],l[2]);d.ledger.unshift([new Date().toISOString(),n,type,l[0],tw.value,b,(incoming?1:-1)*l[1],l[2]]);v+=l[1]*l[2]});d.docs.unshift([n,type,td.value,'Posted',tw.value,tr.value,v]);audit('POST',title,n);save();mr.innerHTML='';toast(n+' posted');render()}catch(e){toast(e.message)}});function add(){let e=document.createElement('div');e.className='ln';e.innerHTML=`<select class="li"><option value="">Item...</option>${opts(d.items)}</select><input class="lq" type="number" min=".01" value="1"><input class="lc" type="numbe function transfer(){return head('Inventory Transfer','Moves stock between warehouses; company total remains unchanged.','<button id="itnew" class="btn p">+ Inventory Transfer</button>')+`<div class="card ct">${table(['Document','Date','Status','Destination','Reason','Value'],d.docs.filter(x=>x[1]=='IT').map(x=>[x[0],x[2],bd(x[3]),wh(x[4])[1],x[5],cash(x[6])]))}</div>`}function itForm(){modal('Post Inventory Transfer',`<div class="fg"><div class="fld"><label>From Warehouse</label><select id="fw">${opts(d.wh)}</select></div><div class="fld"><label>To Warehouse</label><select id="tow">${opts(d.wh)}</select></div><div class="fld"><label>Item</label><select id="ii">${opts(d.items)}</select></div><div class="fld"><label>Qty</label><input id="iq" type="number" value="1"></div></div>`,'Post',()=>{try{if(fw.value==tow.value)throw Error('Warehouses must differ');let q=+iq.value,n=no('IT'),sb=d.stock.find(s=>s[0]==ii.value&&s[1]==fw.value&&s[3]>0),fb=sb?.[2]||d.bins.find(b=>b[1]==fw.value)?.[0],tb=d.bins.find(b=>b[1]==tow.value)?.[0],c=sb?.[4]||0;stockMove(ii.value,fw.value,fb,-q,c);stockMove(ii.value,tow.value,tb,q,c);d.ledger.unshift([new Date().toISOString(),n,'IT',ii.value,fw.value,fb,-q,c],[new Date().toISOString(),n,'IT',ii.value,tow.value,tb,q,c]);d.docs.unshift([n,'IT',day(),'Posted',tow.value,wh(fw.value)[1]+' → '+wh(tow.value)[1],q*c]);audit('POST','Inventory Transfer',n);save();mr.innerHTML='';toast(n+' posted');render()}catch(e){toast(e.message)}})}
function stock(){return head('Stock Overview','On hand by item, warehouse and bin.','<button id="sex" class="btn">Export CSV</button>')+`<div class="card ct"><div class="toolbar"><input id="ss" class="grow" placeholder="Search stock..."></div>${table(['Item','Description','Warehouse','Bin','On Hand','UoM','Cost','Value'],d.stock.filter(s=>s[3]).map(s=>[`<b>${it(s[0])[1]}</b>`,it(s[0])[2],wh(s[1])[1],`<span class="mono">${bn(s[2])[2]}</span>`,fmt(s[3]),it(s[0])[4],cash(s[4]),cash(s[3]*s[4])]))}</div>`}function ledger(){return head('Stock Ledger','Immutable movement history for the dummy/UAT browser database.','<button id="lex" class="btn">Export CSV</button>')+`<div class="card ct">${table(['Date/Time','Document','Type','Item','Warehouse','Bin','Qty','Cost'],d.ledger.map(l=>[new Date(l[0]).toLocaleString('en-IN'),`<b class="mono">${l[1]}</b>`,l[2],it(l[3])[1],wh(l[4])[1],bn(l[5])[2],`<span class="${l[6]>=0?'pos':'neg'}">${l[6]>0?'+':''}${fmt(l[6])}</span>`,cash(l[7])]))}</div>`}
function counts(){return head('Inventory Count','Blind physical count, then controlled inventory posting.','<button id="cnew" class="btn p">+ New Count</button>')+`<div class="card ct">${d.counts.length?table(['Count','Warehouse','Status','Lines',''],d.counts.map(c=>[c.no,wh(c.w)[1],bd(c.s),c.lines.length,c.s=='Open'?`<button class="btn ce" data-i="${c.id}">Enter Count</button>`:''])):'<div class="empty">No new counts yet.</div>'}</div>`}function newCount(){modal('New Inventory Count',`<div class="fld"><label>Warehouse</label><select id="cw">${opts(d.wh)}</select></div>`,'Create',()=>{let its=[...new Set(d.stock.filter(s=>s[1]==cw.value).map(s=>s[0]))];if(!its.length)return toast('Warehouse has no stock');let n=no('IC');d.counts.unshift({id:id('C'),no:n,w:cw.value,s:'Open',lines:its.map(i=>[i,qty(i,cw.value),null])});audit('CREATE','Inventory Count',n);save();mr.innerHTML='';toast('Count created');render()})}function enterCount(cid){let c=d.counts.find(x=>x.id==cid);modal('Enter Count '+c.no,table(['Item','Counted Qty'],c.lines.map((l,n)=>[it(l[0])[1],`<input class="cv" data-n="${n}" type="number" value="${l[2]??''}">`])),'Submit',()=>{if($$('.cv').some(x=>x.value===''))return toast('Enter all counts');$$('.cv').forEach(x=>c.lines[+x.dataset.n][2]=+x.value);c.s='Counted';audit('SUBMIT','Inventory Count',c.no);save();mr.innerHTML='';toast('Count submitted');render()})}function posting(){let a=d.counts.filter(c=>c.s=='Counted');return head('Inventory Posting','Post count variances to stock ledger.')+`<div class="card ct">${a.length?table(['Count','Warehouse','Variance',''],a.map(c=>[c.no,wh(c.w)[1],fmt(c.lines.reduce((z,l)=>z+(l[2]-l[1]),0)),`<button class="btn p cp" data-i="${c.id}">Post Variance</button>`])):'<div class="empty">No counted documents waiting.</div>'}</div>`}function postCount(cid){try{let c=d.counts.find(x=>x.id==cid),n=no('IP');c.lines.forEach(l=>{let diff=l[2]-l[1];if(!diff)return;let s=d.stock.find(s=>s[0]==l[0]&&s[1]==c.w),b=s?.[2]||d.bins.find(b=>b[1]==c.w)?.[0],co=s?.[4]||0;stockMove(l[0],c.w,b,diff,co);d.ledger.unshift([new Date().toISOString(),n,'IP',l[0],c.w,b,diff,co])});c.s='Posted';d.docs.unshift([n,'IP',day(),'Posted',c.w,'Count variance',0]);audit('POST','Inventory Posting',n);save();toast(n+' posted');render()}catch(e){toast(e.message)}}
function reports(){let low=d.items.filter(i=>qty(i[0])<i[6]);return head('Reports','Operational inventory and reconciliation reports.','<button id="rex" class="btn">Export Low Stock</button>')+`<div class="grid two"><div class="card ct"><h3>Low Stock</h3>${low.length?table(['Item','On Hand','Min'],low.map(i=>[i[1],fmt(qty(i[0])),i[6]])):'<div class="empty">None</div>'}</div><div class="card ct"><h3>Reconciliation</h3><p>Ledger entries: <b>${d.ledger.length}</b></p><p>Stock rows: <b>${d.stock.length}</b></p><p>Inventory value: <b>${cash(value())}</b></p></div></div>`}function uat(){let p=d.uat.filter(x=>x[2]=='Pass').length,f=d.uat.filter(x=>x[2]=='Fail').length;return head('100 UAT Register','Mandatory dummy test register before production go-live.','<button id="urun" class="btn p">Run Demo Checks</button>')+`<div class="card ct"><p><b>${p}</b> Pass · <b>${f}</b> Fail · <b>${100-p-f}</b> Not Run</p><div class="bar"><i style="width:${p}%"></i></div><br>${table(['ID','Area','Status'],d.uat.map(x=>[x[0],x[1],bd(x[2])]))}</div>`}function auditPage(){return head('Audit Trail','User actions recorded in the UAT browser database.')+`<div class="card ct">${table(['Timestamp','Action','Entity','Reference','User'],d.audit.map(x=>[new Date(x[0]).toLocaleString('en-IN'),x[1],x[2],x[3],x[4]]))}</div>`}function settings(){return head('Settings','Dummy/UAT controls.')+`<div class="card ct"><div class="notice">All data is dummy and stored only in this browser. No production stock is touched.</div><button id="reset" class="btn bad">Reset Demo Data</button></div>`}
const P={dash:['Dashboard',dash],items:['Item Master',items],warehouse:['Warehouse / Rack / Bin',warehouse],gr:['Inward (GRN)',()=>tx('GR','Goods Receipt',1)],opening:['Opening Balance',()=>tx('OB','Opening Balance',1)],gi:['Goods Issue',()=>tx('GI','Goods Issue',0)],transfer:['Inventory Transfer',transfer],bin:['Bin to Bin',()=>head('Bin to Bin Transfer','Use Inventory Transfer logic at bin level in this UAT build.')+stock()],adjust:['Stock Adjustment',()=>head('Stock Adjustment','Use controlled Goods Receipt / Goods Issue / Count Posting; direct On Hand edit is blocked.')],count:['Inventory Count',counts],posting:['Inventory Posting',posting],stock:['Stock Overview',stock],ledger:['Stock Ledger',ledger],reports:['Reports',reports],uat:['100 UAT Register',uat],audit:['Audit Trail',auditPage],settings:['Settings',settings]};
function csv(rows,name){let a=document.createElement('a'),c=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name;a.click()}function render(){let p=P[route]||P.dash;crumb.innerHTML=p[0]+'<small>Dummy / UAT environment</small>';page.innerHTML=p[1]();if(route=='dash'){qgr.onclick=()=>go('gr');qgi.onclick=()=>go('gi')}if(route=='items'){inew.onclick=()=>itemForm();$$('.edit').forEach(b=>b.onclick=()=>itemForm(b.dataset.i));is.oninput=()=>$$('#page tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(is.value.toLowerCase())?'':'none');iex.onclick=()=>csv(d.items,'items.csv')}if(route=='warehouse')bnew.onclick=newBin;if(['gr','gi','opening'].includes(route))tnew.onclick=()=>txForm(route=='opening'?'OB':route.toUpperCase());if(route=='transfer')itnew.onclick=itForm;if(route=='count'){cnew.onclick=newCount;$$('.ce').forEach(b=>b.onclick=()=>enterCount(b.dataset.i))}if(route=='posting')$$('.cp').forEach(b=>b.onclick=()=>postCount(b.dataset.i));if(route=='stock'){ss.oninput=()=>$$('#page tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(ss.value.toLowerCase())?'':'none');sex.onclick=()=>csv(d.stock,'stock.csv')}if(route=='ledger')lex.onclick=()=>csv(d.ledger,'ledger.csv');if(route=='reports')rex.onclick=()=>csv(d.items.filter(i=>qty(i[0])<i[6]),'low-stock.csv');if(route=='uat')urun.onclick=()=>{let ok=d.stock.every(s=>s[3]>=0)&&new Set(d.items.map(i=>i[1])).size==d.items.length;for(let i=0;i<10;i++)d.uat[i][2]=ok?'Pass':'Fail';audit('RUN','UAT','Automated Checks');save();toast(ok?'Demo checks passed':'Checks failed');render()};if(route=='settings')reset.onclick=()=>{if(confirm('Reset all dummy data?')){d=clone(seed);save();toast('Demo data reset');render()}}}
ham.onclick=()=>{side.classList.add('open');ov.classList.add('show')};ov.onclick=()=>{side.classList.remove('open');ov.classList.remove('show')};ms.oninput=()=>{$$('.nav').forEach(b=>b.style.display=!ms.value||b.dataset.q.includes(ms.value.toLowerCase())?'':'none')};nav();render();save();
</script></body></html>
