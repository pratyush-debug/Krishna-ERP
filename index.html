const navGroups=[['Frequent',[['dash','▦','Dashboard','Overview'],['items','◈','Item Master','Master Data'],['adjust','☷','Stock Adjustment','Administration']]],['Inventory',[['gr','⬇','Inward (GRN)','Goods Receipt'],['gi','⬆','Goods Issue','Consumption'],['transfer','⇆','Inventory Transfer','Movement'],['stock','▤','Stock Overview','On hand']]],['Administration',[['admin','⚙','Admin Panel','Users, roles & master data'],['audit','◌','Audit Trail','User actions']]]];
function nav(){let h='';navGroups.forEach(g=>h+=`<div class="sec">${g[0]}</div>`+g[1].map(x=>`<button class="nav ${route===x[0]?'active':''}" data-r="${x[0]}" data-q="${(x[2]+' '+x[3]).toLowerCase()}"><span class="ic">${x[1]}</span><span><b>${x[2]}</b><small>${x[3]}</small></span></button>`).join(''));$('#nav').innerHTML=h;$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.r))}

function head(t,s,a=''){return `<div class="head"><div><h1>${t}</h1><p>${s}</p></div><div class="actions">${a}</div></div>`}function table(h,r){return `<div class="card table"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`}function badge(s){return `<span class="badge ${['Active','Posted','Matched','Reviewed'].includes(s)?'green':['Inactive','Cancelled'].includes(s)?'red':'amber'}">${s}</span>`}function toast(m){$('#toast').textContent=m;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1600)}function modal(h){$('#modal').innerHTML=`<div class="modalbg"><div class="modal">${h}</div></div>`}function closeModal(){$('#modal').innerHTML=''}function log(a,e){d.audit.unshift([new Date().toLocaleString(),a,e,'Pratyush Kumar']);save()}
function dashboard(){let q=d.stock.reduce((a,s)=>a+s[2],0),v=d.stock.reduce((a,s)=>a+s[2]*s[3],0);return head('Dashboard','Real-time dummy/UAT inventory overview')+`<div class="grid kpis"><div class="card pad"><div class="label">Inventory Value</div><div class="value">${cash(v)}</div></div><div class="card pad"><div class="label">Total Qty</div><div class="value">${fmt(q)}</div></div><div class="card pad"><div class="label">Warehouses</div><div class="value">${d.wh.length}</div></div><div class="card pad"><div class="label">Open Flags</div><div class="value">${d.uploads.filter(x=>x[5]==='Open').length}</div></div></div><br>${stockTable()}`}
function stockTable(){return table(['Item','Warehouse','Qty','Rate','Value'],d.stock.map(s=>`<tr><td>${d.items.find(i=>i[0]===s[0])?.[2]}</td><td>${d.wh.find(w=>w[0]===s[1])?.[1]}</td><td>${fmt(s[2])}</td><td>${cash(s[3])}</td><td>${cash(s[2]*s[3])}</td></tr>`))}function stock(){return head('Stock Overview','On-hand dummy/UAT stock by warehouse')+stockTable()}

function newAdj(){modal(`<div class="mh"><h3>New Stock Adjustment</h3><button class="btn x" onclick="closeModal()">×</button></div><div class="mb"><div class="notice">UAT only. Password 1234 is required to post.</div><div class="form"><div class="field"><label>Type</label><select id="at"><option>Opening Balance</option><option>Reconciliation Adjustment</option></select></div><div class="field"><label>Warehouse</label><select id="aw">${d.wh.map(w=>`<option value="${w[0]}">${w[1]}</option>`).join('')}</select></div><div class="field"><label>Item</label><select id="ai">${d.items.map(i=>`<option value="${i[0]}">${i[1]} - ${i[2]}</option>`).join('')}</select></div><div class="field"><label>Quantity Delta</label><input id="aq" type="number"></div><div class="field full"><label>Notes</label><textarea id="an"></textarea></div><div class="field full"><label>Admin Password</label><input id="ap" type="password"></div></div></div><div class="mf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="postAdj()">Post Adjustment</button></div>`)}function postAdj(){if($('#ap').value!=='1234')return toast('Invalid UAT password');let q=Number($('#aq').value),iid=$('#ai').value,wid=$('#aw').value;if(!q)return toast('Enter quantity delta');let s=d.stock.find(x=>x[0]===iid&&x[1]===wid);if(q<0&&(!s||s[2]+q<0))return toast('Insufficient stock');if(!s){s=[iid,wid,0,0];d.stock.push(s)}s[2]+=q;let n='ADJ'+String(++d.seq.ADJ).padStart(4,'0')+'/2627';d.adjustments.unshift([n,new Date().toLocaleDateString('en-GB'),wid,$('#at').value,'Pratyush Kumar',$('#an').value,'Posted']);save();log('POST','Stock Adjustment '+n);closeModal();render()}function viewAdj(i){let a=d.adjustments[i];modal(`<div class="mh"><h3>${a[0]}</h3><button class="btn x" onclick="closeModal()">×</button></div><div class="mb"><p><b>Warehouse:</b> ${d.wh.find(w=>w[0]===a[2])?.[1]}</p><p><b>Type:</b> ${a[3]}</p><p><b>By:</b> ${a[4]}</p><p><b>Notes:</b> ${a[5]||'-'}</p><p><b>Status:</b> ${a[6]}</p></div>`)}function cancelAdj(i){modal(`<div class="mh"><h3>Cancel ${d.adjustments[i][0]}</h3><button class="btn x" onclick="closeModal()">×</button></div><div class="mb"><div class="field"><label>Admin Password</label><input id="cp" type="password" placeholder="1234"></div></div><div class="mf"><button class="btn danger" onclick="doCancelAdj(${i})">Confirm Cancel</button></div>`)}function doCancelAdj(i){if($('#cp').value!=='1234')return toast('Invalid password');d.adjustments[i][6]='Cancelled';save();log('CANCEL','Adjustment '+d.adjustments[i][0]);closeModal();render()}
function admin(){return head('Admin Panel','Manage users, roles, and master data')+`<div class="tabs">${[['users','♙','User Management'],['roles','⚿','Roles & Permissions'],['masters','⚙','Master Data'],['recon','▤','Stock vs Crate Recon'],['uploads','⚠','Flagged Uploads']].map(x=>`<button class="tab ${adminTab===x[0]?'active':''}" onclick="adminTab='${x[0]}';render()">${x[1]} ${x[2]}</button>`).join('')}</div>${adminTab==='users'?adminUsers():adminTab==='roles'?adminRoles():adminTab==='masters'?adminMasters():adminTab==='recon'?adminRecon():adminUploads()}`}
function adminUsers(){let a=d.users.filter(x=>x[6]==='Active').length;return `<div class="toolbar"><input class="grow" placeholder="Search users by name, email, role..."><button class="btn primary" onclick="newUser()">♙ Add New User</button></div><div class="grid admincards"><div class="card pad"><div class="value" style="color:#2563eb">${d.users.length}</div><div class="label">Total Users</div></div><div class="card pad"><div class="value" style="color:#159947">${a}</div><div class="label">Active</div></div><div class="card pad"><div class="value" style="color:#c21f24">${d.users.length-a}</div><div class="label">Inactive</div></div><div class="card pad"><div class="value" style="color:#7c2ce2">${d.roles.length}</div><div class="label">Roles</div></div></div><br>${table(['Name','Email','Role','Designation','Plant','Warehouse','Status','Actions'],d.users.map((u,i)=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td><span class="badge">${u[2]}</span></td><td>${u[3]}</td><td>${u[4]}</td><td>${u[5]}</td><td>${badge(u[6])}</td><td><span class="link" onclick="editUser(${i})">✎</span> &nbsp;<span class="link" onclick="toggleUser(${i})">◉</span></td></tr>`))}`}
function newUser(){userModal(-1)}function editUser(i){userModal(i)}function userModal(i){let u=i>=0?d.users[i]:['','','Accountant','','','','Active'];modal(`<div class="mh"><h3>${i>=0?'Edit':'Add New'} User</h3><button class="btn x" onclick="closeModal()">×</button></div><div class="mb"><div class="form"><div class="field"><label>Name</label><input id="un" value="${u[0]}"></div><div class="field"><label>Email</label><input id="ue" value="${u[1]}"></div><div class="field"><label>Role</label><select id="ur">${d.roles.map(r=>`<option ${r[0]===u[2]?'selected':''}>${r[0]}</option>`).join('')}</select></div><div class="field"><label>Designation</label><input id="ud" value="${u[3]}"></div><div class="field"><label>Plant</label><input id="up" value="${u[4]}"></div><div class="field"><label>Warehouse</label><input id="uw" value="${u[5]}"></div></div></div><div class="mf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser(${i})">Save</button></div>`)}function saveUser(i){let u=[$('#un').value,$('#ue').value,$('#ur').value,$('#ud').value,$('#up').value,$('#uw').value,i>=0?d.users[i][6]:'Active'];if(i>=0)d.users[i]=u;else d.users.push(u);save();log(i>=0?'UPDATE':'CREATE','User '+u[0]);closeModal();render()}function toggleUser(i){d.users[i][6]=d.users[i][6]==='Active'?'Inactive':'Active';save();render()}
function adminRoles(){return `<div class="toolbar"><div class="grow"></div><input id="newrole" placeholder="New role name"><button class="btn primary" onclick="addRole()">＋ Add role</button></div><h3>Roles</h3><div class="grid rolegrid">${d.roles.map((r,i)=>`<div class="card role"><b>${r[0]}</b><small>${r[1]}</small><span class="link">${r[2]} users</span><div style="margin-top:12px"><button class="btn" onclick="rolePerm(${i})">Permissions</button></div></div>`).join('')}</div>`}function addRole(){let n=$('#newrole').value.trim();if(!n)return;d.roles.push([n,'No description',0]);save();render()}function rolePerm(i){let r=d.roles[i];modal(`<div class="mh"><h3>${r[0]} Permissions</h3><button class="btn x" onclick="closeModal()">×</button></div><div class="mb">${['View Masters','Create GRN','Post Goods Issue','Stock Adjustment','Inventory Transfer','Admin Panel','Reports','Audit'].map(x=>`<label style="display:block;margin:10px"><input type="checkbox" ${i===1?'checked':''}> ${x}</label>`).join('')}</div><div class="mf"><button class="btn primary" onclick="toast('Permissions saved');closeModal()">Save Permissions</button></div>`)}
function adminMasters(){return `<div class="grid admincards">${d.masters.map(m=>`<div class="card master"><div class="color" style="background:${m[2]}">${m[1]} <span style="float:right">▧</span></div><div class="body"><b>${m[0]}</b><small>${m[3]}</small><div style="margin-top:10px"><button class="btn" onclick="toast('${m[0]} opened')">Manage</button></div></div></div>`).join('')}</div>`}
function adminRecon(){return `<div class="notice"><b>⚠ Stock vs Crate Reconciliation</b><br>Compares crate_contents against stock_ledger per item × warehouse × batch.</div><div class="grid kpis"><div class="card pad"><div class="label">Total drift rows</div><div class="value">${d.crateRecon.length}</div></div><div class="card pad"><div class="label">Crate phantoms</div><div class="value" style="color:#dc2626">${d.crateRecon.filter(x=>x[7]==='Crate phantom').length}</div></div><div class="card pad"><div class="label">Ledger phantoms</div><div class="value" style="color:#2563eb">${d.crateRecon.filter(x=>x[7]==='Ledger phantom').length}</div></div><div class="card pad"><div class="label">Mismatched</div><div class="value" style="color:#d97706">${d.crateRecon.length}</div></div></div><br><div class="toolbar"><input class="grow" placeholder="Search by item code, name, warehouse, or batch..."><select><option>All drift (${d.crateRecon.length})</option></select><button class="btn" onclick="toast('Reconciliation refreshed')">↻ Refresh</button></div>${table(['Item Code','Item Name','Warehouse','Batch','In Crates','Ledger Net','Drift','Type'],d.crateRecon.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]||'-'}</td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]}</td><td>${x[7]}</td></tr>`))}`}
function adminUploads(){let rows=d.uploads.filter(x=>x[5]==='Open');return `<h3>Flagged Uploads</h3><p style="color:#687386">Documents the AI verifier suspected do not match what the upload slot expected. ${rows.length} open.</p>${table(['When','Upload slot','Expected','Why flagged','Uploaded by','Document','Action'],rows.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td>${u[2]}</td><td>${u[3]}</td><td>${u[4]}</td><td><span class="link" onclick="toast('Document preview')">View</span></td><td><button class="btn" onclick="reviewUpload(${d.uploads.indexOf(u)})">Mark reviewed</button></td></tr>`))}` }function reviewUpload(i){d.uploads[i][5]='Reviewed';save();log('REVIEW','Flagged upload '+d.uploads[i][1]);render()}
function generic(t){return head(t,'Dummy/UAT workflow screen')+`<div class="notice">This workflow remains available in UAT mode. Operational transaction logic is simulated only.</div>`}function audit(){return head('Audit Trail','UAT action history')+table(['When','Action','Entity','User'],d.audit.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`))}
function render(){let m={dash:dashboard,items,stock,adjust,admin,audit,gr:()=>generic('Inward (GRN)'),gi:()=>generic('Goods Issue'),transfer:()=>generic('Inventory Transfer')};$('#page').innerHTML=(m[route]||dashboard)();$('#crumb').innerHTML=`${route==='admin'?'Admin Panel':route==='adjust'?'Stock Adjustment':route==='items'?'Item Master':route==='stock'?'Stock Overview':'Dashboard'}<small>Dummy / UAT environment</small>`}nav();render();$('#hamb').onclick=()=>$('#side').classList.toggle('open');$('#menuSearch').oninput=e=>$$('.nav').forEach(b=>b.style.display=b.dataset.q.includes(e.target.value.toLowerCase())?'flex':'none');
</script></body></html>
