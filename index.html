function transPage(type){let names={gr:'Inward (GRN)',opening:'Opening Balance',gi:'Goods Issue',transfer:'Inventory Transfer',binmove:'Bin to Bin'},pfx={gr:'GR',opening:'OB',gi:'GI',transfer:'IT',binmove:'IT'};return `${head(names[type],type==='gi'?'Consumption / Scrap':'Controlled dummy transaction',`<button class="btn primary" onclick="openTrans('${type}')">+ New ${names[type]}</button>`)}<div class="notice">All entries are dummy/UAT only. Negative stock is blocked.</div><div class="card pad">${table(['Document','Type','Date','Status','Warehouse','Value'],d.docs.filter(x=>x[1]===pfx[type]).map(x=>[x[0],x[1],x[2],badge(x[3]),wh(x[4])[1],cash(x[6])]))}</div>`}function openTrans(type){let mv=/transfer|binmove/.test(type);modal(`<div class="mh"><h3>New Transaction</h3><button class="btn x" onclick="closeModal()">✕</button></div><div class="mb"><div class="form"><div class="field"><label>Item</label><select id="ti">${d.items.map(i=>`<option value="${i[0]}">${i[1]} · ${i[2]}</option>`).join('')}</select></div><div class="field"><label>Warehouse</label><select id="tw" onchange="fillBins('tw','tb')">${d.wh.map(w=>`<option value="${w[0]}">${w[1]}</option>`).join('')}</select></div><div class="field"><label>Bin</label><select id="tb"></select></div>${mv?`<div class="field"><label>Destination Warehouse</label><select id="dw" onchange="fillBins('dw','db')">${d.wh.map(w=>`<option value="${w[0]}">${w[1]}</option>`).join('')}</select></div><div class="field"><label>Destination Bin</label><select id="db"></select></div>`:''}<div class="field"><label>Quantity</label><input id="tq" type="number" value="1"></div><div class="field"><label>Unit Cost</label><input id="tc" type="number" value="100"></div></div></div><div class="mf"><button class="btn primary" onclick="postTrans('${type}')">Post</button></div>`);fillBins('tw','tb');if(mv)fillBins('dw','db')}function fillBins(w,b){let wid=$('#'+w).value;$('#'+b).innerHTML=d.bins.filter(x=>x[1]===wid).map(x=>`<option value="${x[0]}">${x[2]}</option>`).join('')}function stockRow(i,w,b,delta,c){let s=d.stock.find(x=>x[0]===i&&x[1]===w&&x[2]===b);if(s){if(s[3]+delta<0)return false;s[3]+=delta;if(delta>0)s[4]=c}else{if(delta<0)return false;d.stock.push([i,w,b,delta,c])}return true}function docNo(p){d.seq[p]=(d.seq[p]||0)+1;return `${p}-2026-${String(d.seq[p]).padStart(6,'0')}`}function postTrans(type){let i=$('#ti').value,w=$('#tw').value,b=$('#tb').value,q=Number($('#tq').value),c=Number($('#tc').value),p=type==='gr'?'GR':type==='opening'?'OB':type==='gi'?'GI':'IT',no=docNo(p);if(type==='gi'){if(!stockRow(i,w,b,-q,c))return toast('Insufficient stock');d.ledger.push([new Date().toISOString(),no,'GI',i,w,b,-q,c])}else if(type==='gr'||type==='opening'){stockRow(i,w,b,q,c);d.ledger.push([new Date().toISOString(),no,p,i,w,b,q,c])}else{let dw=$('#dw').value,db=$('#db').value;if(!stockRow(i,w,b,-q,c))return toast('Insufficient stock');stockRow(i,dw,db,q,c);d.ledger.push([new Date().toISOString(),no,'IT-OUT',i,w,b,-q,c]);d.ledger.push([new Date().toISOString(),no,'IT-IN',i,dw,db,q,c])}d.docs.push([no,p,today(),'Posted',w,'UAT',q*c]);audit('POST',type,no);save();closeModal();render();toast(no+' posted')}
function stockPage(){return `${head('Stock Overview','Current on-hand by item, warehouse and bin')}<div class="card pad">${table(['Item','Name','Warehouse','Bin','Qty','Cost','Value'],d.stock.map(s=>[item(s[0])[1],item(s[0])[2],wh(s[1])[1],bin(s[2])[2],fmt(s[3]),cash(s[4]),cash(s[3]*s[4])]))}</div>`}function ledgerPage(){return `${head('Stock Ledger','Movement history')}<div class="card pad">${table(['Timestamp','Document','Type','Item','Warehouse','Bin','Qty'],d.ledger.slice().reverse().map(x=>[x[0].replace('T',' ').slice(0,19),x[1],x[2],item(x[3])[1],wh(x[4])[1],bin(x[5])[2],fmt(x[6])]))}</div>`}
function countPage(){return `${head('Inventory Count','Create physical counts',`<button class="btn primary" onclick="openCount()">+ New Count</button>`)}<div class="card pad">${table(['Count','Date','Item','Warehouse','System','Counted','Variance','Status'],d.counts.map(c=>[c[0],c[1],item(c[2])[1],wh(c[3])[1],c[5],c[6],c[7],badge(c[8])]))}</div>`}function openCount(){modal(`<div class="mh"><h3>New Count</h3><button class="btn x" onclick="closeModal()">✕</button></div><div class="mb"><div class="form"><div class="field"><label>Item</label><select id="ci">${d.items.map(i=>`<option value="${i[0]}">${i[1]}</option>`).join('')}</select></div><div class="field"><label>Warehouse</label><select id="cw" onchange="fillBins('cw','cb')">${d.wh.map(w=>`<option value="${w[0]}">${w[1]}</option>`).join('')}</select></div><div class="field"><label>Bin</label><select id="cb"></select></div><div class="field"><label>Counted Qty</label><input id="cq" type="number"></div></div></div><div class="mf"><button class="btn primary" onclick="saveCount()">Save</button></div>`);fillBins('cw','cb')}function saveCount(){let i=$('#ci').value,w=$('#cw').value,b=$('#cb').value,sys=qty(i,w,b),cnt=Number($('#cq').value),no=docNo('IC');d.counts.push([no,today(),i,w,b,sys,cnt,cnt-sys,'Pending']);save();closeModal();render()}function postingPage(){let p=d.counts.filter(c=>c[8]==='Pending');return `${head('Inventory Posting','Post count variances')}<div class="card pad">${table(['Count','Item','Warehouse','Variance','Action'],p.map(c=>[c[0],item(c[2])[1],wh(c[3])[1],c[7],`<button class="btn primary" onclick="postCount('${c[0]}')">Post</button>`]))}</div>`}function postCount(no){let c=d.counts.find(x=>x[0]===no);if(!stockRow(c[2],c[3],c[4],c[7],item(c[2])[6]))return toast('Negative stock blocked');let ip=docNo('IP');d.ledger.push([new Date().toISOString(),ip,'COUNT',c[2],c[3],c[4],c[7],item(c[2])[6]]);c[8]='Posted';save();render()}
function adjustPage(){return `${head('Stock Adjustment','Master-admin-only. Opening balance or reconciliation adjustment.',`<button class="btn primary" onclick="openAdj()">+ New Adjustment</button>`)}<div class="tabs"><button class="tab active">Adjustments</button><button class="tab" onclick="go('count')">Stock Take Approvals</button></div><div class="card pad"><div class="toolbar"><input class="grow" placeholder="Search number / warehouse / notes"><select><option>All status</option><option>Posted</option><option>Cancelled</option></select><select><option>All types</option><option>Opening Balance</option><option>Reconciliation Adjustment</option></select></div>${table(['Number','Date','Warehouse','Type','By','Notes','Status','Action'],d.adjustments.map((a,i)=>[`<span style="color:var(--blue)">${a[0]}</span>`,a[1],wh(a[2])[2],a[3],a[4],a[5],badge(a[6]),`<button class="btn" onclick="toast('Viewing ${a[0]}')">View</button> <button class="btn danger" onclick="cancelAdj(${i})">Cancel</button>`]))}</div>`}function openAdj(){modal(`<div class="mh"><h3>New Stock Adjustment</h3><button class="btn x" onclick="closeModal()">✕</button></div><div class="mb"><div class="form"><div class="field"><label>Type</label><select id="at"><option>Opening Balance</option><option>Reconciliation Adjustment</option></select></div><div class="field"><label>Item</label><select id="ai">${d.items.map(i=>`<option value="${i[0]}">${i[1]}</option>`).join('')}</select></div><div class="field"><label>Warehouse</label><select id="aw" onchange="fillBins('aw','ab')">${d.wh.map(w=>`<option value="${w[0]}">${w[1]}</option>`).join('')}</select></div><div class="field"><label>Bin</label><select id="ab"></select></div><div class="field"><label>Delta (+/-)</label><input id="aq" type="number"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><div class="field full"><label>Notes</label><input id="an"></div></div></div><div class="mf"><button class="btn primary" onclick="postAdj()">Post Adjustment</button></div>`);fillBins('aw','ab')}function postAdj(){if($('#ap').value!=='1234')return toast('Wrong UAT password');let q=Number($('#aq').value),i=$('#ai').value,w=$('#aw').value,b=$('#ab').value;if(!stockRow(i,w,b,q,item(i)[6]))return toast('Negative stock blocked');let no='ADJ'+String(++d.seq.ADJ).padStart(4,'0')+'/2627';d.adjustments.unshift([no,today(),w,$('#at').value,'Pratyush Kumar',$('#an').value,'Posted']);d.ledger.push([new Date().toISOString(),no,'ADJ',i,w,b,q,item(i)[6]]);save();closeModal();render();toast(no+' posted')}function cancelAdj(i){let p=prompt('Enter password to cancel');if(p!=='1234')return toast('Wrong password');d.adjustments[i][6]='Cancelled';save();render()}
function adminPage(){let tabs=[['users','User Management'],['roles','Roles & Permissions'],['masters','Master Data'],['recon','Stock vs Crate Recon'],['flagged','Flagged Uploads']];return `${head('Admin Panel','Manage users, roles, and master data')}<div class="tabs">${tabs.map(t=>`<button class="tab ${adminTab===t[0]?'active':''}" onclick="adminTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${adminTab==='users'?adminUsers():adminTab==='roles'?adminRoles():adminTab==='masters'?adminMasters():adminTab==='recon'?adminRecon():adminFlagged()}`}
function adminUsers(){let active=d.users.filter(x=>x[6]==='Active').length;return `<div class="toolbar"><input class="grow" placeholder="Search users by name, email, role..."><button class="btn primary" onclick="openUser()">+ Add New User</button></div><div class="grid admincards">${[['Total Users',d.users.length],['Active',active],['Inactive',d.users.length-active],['Roles',d.roles.length]].map(x=>`<div class="card pad"><div class="value">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('')}</div><div class="card pad" style="margin-top:14px">${table(['Name','Email','Role','Designation','Plant','Warehouse','Status','Actions'],d.users.map((u,i)=>[u[0],u[1],u[2],u[3],u[4],u[5],badge(u[6]),`<button class="btn" onclick="toggleUser(${i})">${u[6]==='Active'?'Deactivate':'Activate'}</button>`]))}</div>`}function openUser(){modal(`<div class="mh"><h3>Add New User</h3><button class="btn x" onclick="closeModal()">✕</button></div><div class="mb"><div class="form"><div class="field"><label>Name</label><input id="un"></div><div class="field"><label>Email</label><input id="ue"></div><div class="field"><label>Role</label><select id="ur">${d.roles.map(r=>`<option>${r[0]}</option>`).join('')}</select></div><div class="field"><label>Designation</label><input id="ud"></div><div class="field"><label>Plant</label><input id="up"></div><div class="field"><label>Warehouse</label><input id="uw"></div></div></div><div class="mf"><button class="btn primary" onclick="saveUser()">Save User</button></div>`)}function saveUser(){d.users.push([$('#un').value,$('#ue').value,$('#ur').value,$('#ud').value,$('#up').value,$('#uw').value,'Active']);save();closeModal();render()}function toggleUser(i){d.users[i][6]=d.users[i][6]==='Active'?'Inactive':'Active';save();render()}
function adminRoles(){return `<div class="toolbar"><input id="rn" class="grow" placeholder="New role name"><button class="btn primary" onclick="addRole()">+ Add role</button></div><div class="grid rolegrid">${d.roles.map((r,i)=>`<div class="card role"><b>${r[0]}</b><small>${r[1]}</small><span style="color:var(--blue)">${r[2]} users</span><div style="margin-top:10px"><button class="btn" onclick="toast('Permissions editor opened for ${r[0]}')">Permissions</button></div></div>`).join('')}</div>`}function addRole(){let n=$('#rn').value.trim();if(!n)return;d.roles.push([n,'Custom role',0]);save();render()}
function adminMasters(){let m=[['Item Master',5753,'#3478f6'],['Vendor Master',509,'#a33df2'],['Customer Master',204,'#18b956'],['Price List Master',2,'#14a88f'],['Warehouse Master',176,'#fb5b0b'],['Plant Master',9,'#ef3340'],['Vehicle Master',196,'#e8a400'],['Transporter Vehicle Types',10,'#e78500'],['Supervisor Master',31,'#5b57f2'],['Driver Master',89,'#e8338b'],['Security Master',21,'#64748b'],['BOM Management',869,'#1ba79a'],['UOM Master',14,'#12a4dc'],['UOM Conversions',2,'#18aabd'],['Number Series',43,'#8b4af1'],['Asset Register (FAR)',7,'#756f6b'],['Colour Master',20,'#d12fe3'],['Polymer Master',15,'#78c500'],['Moulding Machines',42,'#f1284c'],['Mix Recipes',0,'#0faa79']];return `<div class="grid admincards">${m.map(x=>`<div class="card master"><div class="color" style="background:${x[2]}">${x[1]}</div><div class="body"><b>${x[0]}</b><small>Manage ${x[0].toLowerCase()}</small></div></div>`).join('')}</div>`}
function adminRecon(){let drift=d.stock.slice(0,3).map((s,i)=>[item(s[0])[1],item(s[0])[2],wh(s[1])[1],'BATCH-'+(100+i),s[3]+(i?0:5),s[3],i?0:5,i?'Matched':'Mismatched']);return `<div class="notice"><b>Stock vs Crate Reconciliation</b><br>Compares crate contents against stock ledger by item × warehouse × batch.</div><div class="grid kpis">${[['Total drift rows',1],['Crate phantoms',0],['Ledger phantoms',0],['Mismatched',1]].map(x=>`<div class="card pad"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><div class="card pad" style="margin-top:14px">${table(['Item Code','Item Name','Warehouse','Batch','In Crates','Ledger Net','Drift','Type'],drift)}</div>`}
function adminFlagged(){return `<div class="card pad">${table(['When','Upload slot','Expected','Why flagged','Uploaded by','Document','Action'],d.flagged.map((f,i)=>[f[0],f[1],f[2],f[3],f[4],'<span style="color:var(--blue)">View</span>',`<button class="btn" onclick="d.flagged[${i}][5]='Reviewed';save();render()">${f[5]==='Reviewed'?'Reviewed':'Mark reviewed'}</button>`]))}</div>`}
function reportsPage(){return `${head('Reports','Operational reports')}<div class="grid admincards">${['Inventory Status','Stock Movement','Inventory Valuation','Bin Content','Low Stock','Slow Moving','Count Variance','Audit Trail','Warehouse Stock'].map(n=>`<div class="card pad"><b>${n}</b><p style="color:var(--mut)">Filter · Export · Drill-down</p><button class="btn" onclick="toast('${n} opened')">Open</button></div>`).join('')}</div>`}function uatPage(){return `${head('100 UAT Register','Mandatory go-live test gate')}<div class="card pad">${table(['Test ID','Module','Result','Action'],d.uat.map((x,i)=>[x[0],x[1],badge(x[2]),`<select onchange="d.uat[${i}][2]=this.value;save();render()"><option ${x[2]==='Not Run'?'selected':''}>Not Run</option><option ${x[2]==='Pass'?'selected':''}>Pass</option><option ${x[2]==='Fail'?'selected':''}>Fail</option></select>`]))}</div>`}function auditPage(){return `${head('Audit Trail','Dummy user actions and posting history')}<div class="card pad">${table(['Timestamp','Action','Entity','Reference','User'],d.audit.slice().reverse().map(x=>[x[0].replace('T',' ').slice(0,19),x[1],x[2],x[3],x[4]]))}</div>`}function settingsPage(){return `${head('Settings','Demo environment controls')}<div class="card pad"><h3>Pratyush KR Inventory UAT</h3><p>All data is dummy and stored in browser local storage.</p><button class="btn danger" onclick="if(confirm('Reset all dummy data?')){d=clone(seed);save();go('dash')}">Reset All Dummy Data</button></div>`}
function render(){let map={dash:['Dashboard','Overview',dashboard],items:['Item Master','Master Data',itemsPage],warehouse:['Warehouse / Rack / Bin','Master Data',warehousePage],gr:['Inward (GRN)','Inbound',()=>transPage('gr')],opening:['Opening Balance','Inbound',()=>transPage('opening')],gi:['Goods Issue','Outbound',()=>transPage('gi')],transfer:['Inventory Transfer','Internal Movement',()=>transPage('transfer')],binmove:['Bin to Bin','Internal Movement',()=>transPage('binmove')],count:['Inventory Count','Inventory Control',countPage],posting:['Inventory Posting','Inventory Control',postingPage],stock:['Stock Overview','Tracking',stockPage],ledger:['Stock Ledger','Tracking',ledgerPage],adjust:['Stock Adjustment','Administration',adjustPage],admin:['Admin Panel','Administration',adminPage],reports:['Reports','Operational',reportsPage],uatreg:['100 UAT Register','Go-live Gate',uatPage],audit:['Audit Trail','Administration',auditPage],settings:['Settings','Administration',settingsPage]};let m=map[route]||map.dash;$('#crumb').innerHTML=`${m[0]}<small>${m[1]}</small>`;$('#page').innerHTML=m[2]();if(route==='items')renderItemRows()}$('#menuSearch').oninput=e=>{let q=e.target.value.toLowerCase();$$('.nav').forEach(b=>b.style.display=!q||b.dataset.q.includes(q)?'flex':'none')};$('#hamb').onclick=()=>$('#side').classList.toggle('open');window.onhashchange=()=>{route=location.hash.slice(1)||'dash';buildNav();render()};buildNav();render();
</script></body></html>
