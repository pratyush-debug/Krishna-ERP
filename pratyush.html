<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pratyush KR Inventory UAT</title>
  <style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Segoe UI,Arial}#loading{padding:24px;color:#334155}</style>
</head>
<body>
  <div id="loading">Loading Pratyush KR Inventory UAT…</div>
  <script>
    (async function(){
      try {
        const r = await fetch('/index.html?v=' + Date.now(), {cache:'no-store'});
        let html = await r.text();
        html = html.replaceAll('GEPL RJCA Inventory UAT','Pratyush KR Inventory UAT');
        html = html.replaceAll('GEPL RJCA','Pratyush KR');
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.getElementById('loading').textContent = 'Unable to load Pratyush KR Inventory UAT. Please refresh.';
      }
    })();
  </script>
</body>
</html>
